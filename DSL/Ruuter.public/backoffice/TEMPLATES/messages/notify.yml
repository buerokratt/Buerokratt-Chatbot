generate_notification_event_uuid:
  call: http.post
  args:
    url: "[#CHATBOT_DMAPPER_HBS]/return_uuid"
    headers:
      type: json
  result: notification_uuid_result
  next: notify

notify:
  call: http.post
  args:
    url: "[#CHATBOT_NOTIFICATION_NODE]/private/v1/notifications/events"
    body:
      eventUuid: ${notification_uuid_result.response.body.uuid}
      recipient: "CHAT"
      recipientUuid: ${incoming.body.chatId}
      type: ${incoming.body.type}
      payload:
        messageId: ${incoming.body.messageId}
  result: notify_res
  next: return_result

return_result:
  return: "Notification sent"
