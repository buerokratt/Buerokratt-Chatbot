declaration:
  call: declare
  version: 0.1
  description: Description placeholder for 'INTENT_DETECTION'
  method: post
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    body:
      - field: message
        type: string
        description: "Body field 'message'"
      - field: sender
        type: string
        description: "Body field 'sender'"
      - field: domain
        type: string
        description: "Body field 'domain'"

assign_message:
  assign:
    message: ${incoming.body.message ?? ''}

check_if_message_is_service:
  switch:
    - condition: ${message.startsWith("#common_service") || message.startsWith("#service")}
      next: return_skip
  next: get_bot_name

get_bot_name:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-configuration"
    body:
      key: "bot_institution_id"
    error: return_error
  result: get_bot_name_result
  next: check_if_bot_name_exists

check_if_bot_name_exists:
  switch:
    - condition: ${get_bot_name_result.response.body[0]?.value != null}
      next: assignParameters
  next: return_skip

assignParameters:
  assign:
    sender: ${incoming.body.sender}
    domain: ${incoming.body.domain}
    botName: ${get_bot_name_result.response.body[0].value}
    agent_name: "[#ID_AGENT_NAME]"
    domain_id: null
    entities: ${[]}

check_if_bot_is_active:
  switch:
    - condition: ${[#ID_ACTIVE] === true && agent_name !== ''}
      next: checkForDomain
  next: return_skip

checkForDomain:
  switch:
    - condition: ${domain === 'none'}
      next: getSkmConfig
  next: getDomainUUID

getDomainUUID:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-domain-uuid"
    body:
      domainUrl: ${domain + '%'}
  result: domainUuid
  next: validate_domain_res

validate_domain_res:
  switch:
    - condition: ${domainUuid.response.body.length > 0}
      next: assignDomainId
  next: getSkmConfig

assignDomainId:
  assign:
    domain_id: ${domainUuid.response.body[0].domainId}
  next: getDomainSkmConfig

getDomainSkmConfig:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-domain-skm-config"
    body:
      domainUUID: ${domain_id}
  result: skm_res
  next: assignSkmConfig

getSkmConfig:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-skm-config"
  result: skm_res
  next: assignSkmConfig

assignSkmConfig:
  assign:
    skm_config: ${skm_res.response.body[0]}
    azure_client_id: ""
    azure_client_secret: ""
  next: checkForAgenticCredentials

checkForAgenticCredentials:
  switch:
    - condition: ${skm_config.azureClientIdIsSet === 'true'}
      next: fetchAzureClientId
  next: assign_messages

fetchAzureClientId:
  call: http.get
  args:
    url: "[#VAULT_AGENT_BACKOFFICE]/v1/secret/data/backoffice/${domain_id ?? 'global'}/azure-agentic-client-id"
  result: vault_id_res
  next: assignAzureClientId

assignAzureClientId:
  assign:
    azure_client_id: ${vault_id_res.response.body.data.data.client_id}
  next: fetchAzureClientSecret

fetchAzureClientSecret:
  call: http.get
  args:
    url: "[#VAULT_AGENT_BACKOFFICE]/v1/secret/data/backoffice/${domain_id ?? 'global'}/azure-agentic"
  result: vault_res
  next: assignAzureClientSecret

assignAzureClientSecret:
  assign:
    azure_client_secret: ${vault_res.response.body.data.data.client_secret}
  next: assign_messages

assign_messages:
  assign:
    messages: ${[{ role: 'user', content: message }]}

check_if_anonymizer_is_active:
  switch:
    - condition: ${[#ANONYMIZER_ENABLED] === true}
      next: checkForPassedDomain
  next: detect_intent

checkForPassedDomain:
  switch:
    - condition: ${domain_id == null}
      next: getAnonymizerConfig
  next: getDomainAnonymizerConfig

getAnonymizerConfig:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-anonymizer-config"
  result: anonymizer_configs_res
  next: assignAnonymizerConfigs

getDomainAnonymizerConfig:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-domain-anonymizer-config"
    body:
      domainUUID: ${domain_id}
  result: anonymizer_configs_res
  next: assignAnonymizerConfigs

assignAnonymizerConfigs:
  assign:
    anonymizer_configs: ${anonymizer_configs_res.response.body[0]}
  next: check_if_anonymize_before_llm

check_if_anonymize_before_llm:
  switch:
    - condition: ${anonymizer_configs.isAnonymizationBeforeLlm === 'true'}
      next: prepareAnonymizerConfig
  next: detect_intent

prepareAnonymizerConfig:
  call: http.post
  args:
    url: "[#CHATBOT_DMAPPER_HBS]/prepare_anonymizer_config"
    headers:
      type: json
    body:
      texts: ${messages.filter(i => i.role === 'user').map(i => i.content)}
      approach: ${anonymizer_configs.anonymizerSelectedApproach}
      entities: ${anonymizer_configs.anonymizerSelectedEntities.split(',')}
      allowlist: ${anonymizer_configs.anonymizerAllowlist.split(',')}
      denylist: ${anonymizer_configs.anonymizerDenylist.split(',')}
      hash_type: "[#ANONYMIZER_HASH_TYPE]"
  result: preparedAnonymizerConfigs
  next: assignPreparedAnonymizerConfigs

assignPreparedAnonymizerConfigs:
  assign:
    preparedAnonymizerConfigs: ${preparedAnonymizerConfigs.response.body}
  next: anonymizeText

anonymizeText:
  call: http.post
  args:
    url: "[#CHATBOT_ANONYMIZER]/anonymize"
    body:
      texts: ${preparedAnonymizerConfigs.texts}
      anonymizers: ${preparedAnonymizerConfigs.anonymizers}
      entities: ${preparedAnonymizerConfigs.entities}
      allowlist: ${preparedAnonymizerConfigs.allowlist}
      denylist: ${preparedAnonymizerConfigs.denylist}
  result: anonymize_res
  next: assign_anonymized_messages

assign_anonymized_messages:
  assign:
    anonymizedMessages: ${anonymize_res.response.body.results}
    messages: "$=messages.map((m, i) => m.role === 'user' ? {...m, content: anonymizedMessages[messages.slice(0, i).filter(msg => msg.role === 'user').length].text} : m)="

detect_intent:
  call: http.post
  args:
    url: "[#CHATBOT_NOTIFICATIONS]/intent-detection"
    headers:
      Content-Type: application/json
    body:
      messages: ${messages}
      agent_name: ${agent_name}
      agent_type: ${skm_config.azureAgentType}
      azure_client_id: ${azure_client_id}
      azure_client_secret: ${azure_client_secret}
      azure_agentic_max_output_tokens: ${parseInt(skm_config.azureAgenticMaxOutputTokens ?? '4000')}
    error: return_skip
  result: llmResponse
  next: check_for_content

check_for_content:
  switch:
    - condition: ${llmResponse.response.body.content?.startsWith('{')}
      next: assign_intent_json
  next: return_skip

assign_intent_json:
  assign:
    intentJson: ${JSON.parse(llmResponse.response.body.content)}

check_for_intent:
  switch:
    - condition: ${intentJson.intent === 'OOD'}
      next: return_skip
  next: validate_service

validate_service:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-active-service-by-name"
    body:
      service_name: ${intentJson.intent}
  result: validated_intent
  next: check_intent_present

check_intent_present:
  switch:
    - condition: ${validated_intent.response.body.length > 0}
      next: handleEntities
  next: return_skip

handleEntities:
  switch:
    - condition: ${!intentJson.entities}
      next: trigger_service
  next: assignNewEntities

assignNewEntities:
  assign:
    entities: ${Object.keys(intentJson.entities)}
    filteredEntities: ${[...new Set(entities)]}
    service_entities: ${validated_intent.response.body[0].entities}
  next: check_if_service_entities_are_in_included_in_llm_entities

check_if_service_entities_are_in_included_in_llm_entities:
  switch:
    - condition: ${service_entities.every(e => filteredEntities.includes(e))}
      next: assign_service_entities
  next: assign_empty_entities

assign_service_entities:
  assign:
    service_entities: ${Object.values(intentJson.entities)}
  next: trigger_service

assign_empty_entities:
  assign:
    service_entities: ${[]}
  next: trigger_service

trigger_service:
  template: "[#CHATBOT_PROJECT_LAYER]/chats/trigger-llm-service"
  requestType: templates
  body:
    entities: ${service_entities}
    chatId: ${sender}
    authorId: ${botName}
    ruuterType: ${validated_intent.response.body[0].ruuterType}
    serviceType: ${validated_intent.response.body[0].isCommon}
    serviceName: ${validated_intent.response.body[0].name}
  result: service_response
  error: return_error
  next: check_for_llm_trigger_service_response

check_for_llm_trigger_service_response:
  switch:
    - condition: ${(service_response?.content ?? (service_response + '')).startsWith('ERROR:')}
      next: return_error
  next: return_message

return_message:
  return: ${service_response}
  next: end

return_result:
  return: "service triggered"
  next: end

return_skip:
  return: "skip"
  next: end

return_error:
  status: 409
  return: "Error calling llm"
