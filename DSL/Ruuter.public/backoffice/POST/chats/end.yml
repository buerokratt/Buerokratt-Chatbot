declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'END'"
  method: post
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    body:
      - field: status
        type: string
        description: "Body field 'status'"
      - field: message
        type: json
        description: "Body field 'message'"
      - field: ended
        type: string
        description: "Body field 'ended'"  
    header:
      - field: cookie
        type: string
        description: "Cookie field"
    params:
      - field: chatId
        type: string
        description: "Optional: id of the specific chat being ended, when more than one is tracked in the chatJwt cookie. When present, only that id is removed from the cookie instead of clearing it entirely."

extractRequestData:
  assign:
    cookie: ${incoming.headers.cookie ?? "nonce"}
    chatId: "${incoming.body.message.chatId}"
    queryChatId: ${incoming.params.chatId ?? ""}
    event: "${incoming.body.message.event}"
    authorRole: ${incoming.body.message.authorRole}
    authorTimestamp: "${incoming.body.message.authorTimestamp}"
    status: "${incoming.body.status}"
    endedTimestamp: ${incoming.body.ended ?? new Date().toISOString()}
  next: deleteMessagePreview

deleteMessagePreview:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/delete-message-preview"
    body:
      chatId: ${chatId}
      content: ""
  result: res
  next: getMessageUuid

getMessageUuid:
  call: http.post
  args:
    url: "[#CHATBOT_DMAPPER_HBS]/return_uuid"
    headers:
      type: json
  result: message_uuid_result
  next: assignMessageUuid

assignMessageUuid:
  assign:
    messageUuid: ${message_uuid_result.response.body.uuid}
  next: getActiveChatById

getActiveChatById:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-active-chat-by-id"
    body:
      id: ${chatId}
  result: activeChatRes
  next: checkActiveChatResult

checkActiveChatResult:
  switch:
    - condition: ${activeChatRes.response.body.length > 0}
      next: assignChat
  next: return_chat_ended

assignChat:
  assign:
    activeChat: ${activeChatRes.response.body[0]}
  next: postMessage

postMessage:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/insert-message"
    body:
      chatId: ${chatId}
      messageId: ${messageUuid}
      content: ""
      authorTimestamp: ${authorTimestamp}
      authorId: ""
      authorFirstName: ""
      authorLastName: ""
      authorRole: ${authorRole ?? "buerokratt"}
      created: ${new Date().toISOString()}
      rating: ""
      event: ${event}
      forwardedByUser: ""
      forwardedFromCsa: ""
      forwardedToCsa: ""
  result: message_res
  next: endChat

endChat:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/insert-chat"
    body:
      id: ${activeChat.id}
      customerSupportId: ${activeChat.customerSupportId ?? ""}
      customerSupportDisplayName: ${activeChat.customerSupportDisplayName ?? ""}
      csaTitle: ${activeChat.csaTitle ?? ""}
      endUserId: ${activeChat.endUserId ?? ""}
      endUserFirstName: ${activeChat.endUserFirstName ?? ""}
      endUserLastName: ${activeChat.endUserLastName ?? ""}
      status: ${status ?? "ENDED"}
      created: ${activeChat.created ?? new Date().toISOString()}
      ended: ${endedTimestamp ?? new Date().toISOString()}
      feedbackRating: ${activeChat.feedbackRating ?? ""}
      feedbackText: ${activeChat.feedbackText ?? ""}
      endUserEmail: ${activeChat.endUserEmail ?? ""}
      endUserPhone: ${activeChat.endUserPhone ?? ""}
      endUserOs: ${activeChat.endUserOs ?? ""}
      endUserUrl: ${activeChat.endUserUrl ?? ""}
      externalId: ${activeChat.externalId ?? ""}
      forwardedTo: ${activeChat.forwardedTo ?? ""}
      forwardedToName: ${activeChat.forwardedToName ?? ""}
      receivedFrom: ${activeChat.receivedFrom ?? ""}
      receivedFromName: ${activeChat.receivedFromName ?? ""}
  result: end_chat_res
  next: checkForCookie

checkForCookie:
  switch:
    - condition: ${cookie === "nonce"}
      next: notify_chats_final
  next: checkForQueryChatId

checkForQueryChatId:
  switch:
    - condition: ${queryChatId !== ""}
      next: get_chat_jwt_for_removal
  next: blacklist_chat_jwt

get_chat_jwt_for_removal:
  call: http.post
  args:
    url: "[#CHATBOT_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${cookie}
    plaintext: "chatJwt"
  result: chat_jwt_for_removal_res
  next: assignRemainingChatIds

assignRemainingChatIds:
  assign:
    remainingChatIds: ${(chat_jwt_for_removal_res.response.body?.chatIds ?? []).filter(id => id !== queryChatId)}
    previousDefaultChatId: ${chat_jwt_for_removal_res.response.body?.chatId ?? ""}
  next: checkRemainingChatIds

checkRemainingChatIds:
  switch:
    - condition: ${remainingChatIds.length === 0}
      next: blacklist_chat_jwt
  next: get_session_length_for_reissue

get_session_length_for_reissue:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-configuration"
    body:
      key: "session_length"
  result: reissue_session_result
  next: reissue_chat_jwt

reissue_chat_jwt:
  call: http.post
  args:
    url: "[#CHATBOT_TIM]/jwt/custom-jwt-generate"
    body:
      JWTName: "chatJwt"
      expirationInMinutes: ${reissue_session_result.response.body[0]?.value ?? '120'}
      content:
        chatId: "${previousDefaultChatId === queryChatId ? remainingChatIds[0] : previousDefaultChatId}"
        chatIds: ${remainingChatIds}
        forwardTo: ""
  result: reissued_cookie_result
  next: assign_reissued_cookie

assign_reissued_cookie:
  assign:
    chatCookie:
      chatJwt: ${reissued_cookie_result.response.body.token}
      Domain: "[#DOMAIN]"
      Secure: true
      HttpOnly: true
      SameSite: "[#COOKIE_SAME_SITE]"
  next: notify_chats

notify_chats_final:
  template: "[#CHATBOT_PROJECT_LAYER]/chats/notify"
  requestType: templates
  body:
    chatId: ${chatId}
  result: chats_notify_res
  next: return_empty_result

blacklist_chat_jwt:
  call: http.post
  args:
    url: "[#CHATBOT_TIM]/jwt/custom-jwt-blacklist"
    contentType: plaintext
    headers:
      cookie: ${cookie}
    plaintext: "chatJwt"
  result: chat_blacklist_res
  next: assign_chat_cookie

assign_chat_cookie:
  assign:
    chatCookie:
      chatJwt: null
      userJwt: null
      Domain: "[#DOMAIN]"
      Secure: true
      HttpOnly: true
      SameSite: "[#COOKIE_SAME_SITE]"
      Max-Age: 0
  next: blacklist_user_jwt

blacklist_user_jwt:
  call: http.post
  args:
    url: "[#CHATBOT_TIM]/jwt/custom-jwt-blacklist"
    contentType: plaintext
    headers:
      cookie: ${cookie}
    plaintext: "userJwt"
  result: client_blacklist_res
  next: notify_chats

notify_chats:
  template: "[#CHATBOT_PROJECT_LAYER]/chats/notify"
  requestType: templates
  body:
    chatId: ${chatId}
  result: chats_notify_res

remove_chat_id_from_queue_notification_node_if_existed:
  call: http.post
  args:
    url: "[#CHATBOT_NOTIFICATIONS]/dequeue"
    body:
      id: ${chatId}
  result: remove_chat_id_from_queue_notification_node_if_existed_res

return_result:
  headers:
    Set-Cookie: ${chatCookie}
  return: "Ended Chat Successfully"
  next: end

return_empty_result:
  return: "Ended Chat Successfully"
  next: end

return_chat_ended:
  return: "Chat Has Ended"
  status: 400
  next: end
