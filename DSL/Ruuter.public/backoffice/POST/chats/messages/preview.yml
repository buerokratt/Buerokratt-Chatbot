declaration:
  call: declare
  version: 0.1
  description: "Send the user's typing state for a chat"
  method: post
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    body:
      - field: chatId
        type: string
        description: "Body field 'chatId'"

extractRequestData:
  assign:
    chatId: ${incoming.body.chatId}
  next: notify_typing

notify_typing:
  template: "[#CHATBOT_PROJECT_LAYER]/messages/notify"
  requestType: templates
  body:
    chatId: ${chatId}
    type: "typing"
  result: messages_notify_res
  next: return_result

return_result:
  return: "Typing Event Sent Successfully"
  next: end
