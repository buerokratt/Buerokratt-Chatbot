declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'SKM-CONFIG'"
  method: post
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    body:
      - field: azureAgentName
        type: string
        description: "Body field 'azureAgentName'"
      - field: azureAgentType
        type: string
        description: "Body field 'azureAgentType'"
      - field: azureAgenticMaxOutputTokens
        type: string
        description: "Body field 'azureAgenticMaxOutputTokens'"
      - field: azureAgenticUseStructuredInputs
        type: string
        description: "Body field 'azureAgenticUseStructuredInputs'"
      - field: domainUUID
        type: object
        description: "Body field 'domainUUID'"

extractRequestData:
  assign:
    azure_agent_name: ${incoming.body.azureAgentName}
    azure_agent_type: ${incoming.body.azureAgentType}
    azure_agentic_max_output_tokens: ${incoming.body.azureAgenticMaxOutputTokens}
    azure_agentic_use_structured_inputs: ${incoming.body.azureAgenticUseStructuredInputs ?? 'false'}
    domains: ${incoming.body.domainUUID}

checkForDomains:
  switch:
    - condition: ${domains.length > 0}
      next: setDomainSkmConfig
  next: setSkmConfig

setDomainSkmConfig:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/set-domain-skm-config"
    body:
      azure_agent_name: ${azure_agent_name}
      azure_agent_type: ${azure_agent_type}
      azure_agentic_max_output_tokens: ${azure_agentic_max_output_tokens}
      azure_agentic_use_structured_inputs: ${azure_agentic_use_structured_inputs}
      created: ${new Date().toISOString()}
      domains: ${JSON.stringify(domains)}
  result: skm_result
  next: return_result

setSkmConfig:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/set-skm-config"
    body:
      azure_agent_name: ${azure_agent_name}
      azure_agent_type: ${azure_agent_type}
      azure_agentic_max_output_tokens: ${azure_agentic_max_output_tokens}
      azure_agentic_use_structured_inputs: ${azure_agentic_use_structured_inputs}
      created: ${new Date().toISOString()}
  result: skm_result
  next: return_result

return_result:
  return: 'Skm configurations changed successfully'
