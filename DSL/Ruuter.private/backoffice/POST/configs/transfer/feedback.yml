declaration:
  call: declare
  version: 0.1
  description: "Transfer feedback settings from a source domain to one or more target domains"
  method: post
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    body:
      - field: sourceDomainUuid
        type: string
        description: "UUID of the domain to copy settings from"
      - field: targetDomainUuids
        type: object
        description: "Array of target domain UUIDs to copy settings to"

extractRequestData:
  assign:
    sourceDomainUuid: ${incoming.body.sourceDomainUuid}
    targetDomainUuids: ${incoming.body.targetDomainUuids}

fetchSource:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-domain-feedback-config"
    body:
      domainUUID: ${sourceDomainUuid}
  result: source
  next: transferToTargets

transferToTargets:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/set-domain-feedback-config"
    body:
      feedbackActive: ${source.response.body[0].feedbackActive}
      feedbackQuestion: ${source.response.body[0].feedbackQuestion}
      feedbackNoticeActive: ${source.response.body[0].feedbackNoticeActive}
      feedbackNotice: ${source.response.body[0].feedbackNotice}
      isFiveRatingScale: ${source.response.body[0].isFiveRatingScale}
      domains: ${JSON.stringify(targetDomainUuids)}
  result: res

return_result:
  return: ${res.response.body}
  next: end
