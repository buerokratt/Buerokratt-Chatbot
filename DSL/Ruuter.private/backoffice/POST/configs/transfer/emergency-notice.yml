declaration:
  call: declare
  version: 0.1
  description: "Transfer emergency notice settings from a source domain to one or more target domains"
  method: post
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    body:
      - field: sourceDomainUUID
        type: string
        description: "UUID of the domain to copy settings from"
      - field: targetDomainUUIDs
        type: object
        description: "Array of target domain UUIDs to copy settings to"

extractRequestData:
  assign:
    sourceDomainUUID: ${incoming.body.sourceDomainUUID}
    targetDomainUUIDs: ${incoming.body.targetDomainUUIDs}

fetchSource:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-domain-emergency-notice"
    body:
      domainUUID: ${sourceDomainUUID}
  result: source
  next: mapSourceData

mapSourceData:
  assign:
    configMap: ${source.response.body.reduce((acc, row) => { acc[row.key] = row.value; return acc; }, {})}
  next: transferToTargets

transferToTargets:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/set-domain-emergency-notice"
    body:
      emergencyNoticeText: ${configMap.emergencyNoticeText}
      emergencyNoticeStartISO: ${configMap.emergencyNoticeStartISO}
      emergencyNoticeEndISO: ${configMap.emergencyNoticeEndISO}
      isEmergencyNoticeVisible: ${configMap.isEmergencyNoticeVisible}
      created: ${new Date().toISOString()}
      domains: ${JSON.stringify(targetDomainUUIDs)}
  result: res

return_result:
  return: ${res.response.body}
  next: end
