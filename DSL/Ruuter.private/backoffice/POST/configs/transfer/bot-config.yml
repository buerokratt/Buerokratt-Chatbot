declaration:
  call: declare
  version: 0.1
  description: "Transfer bot configuration settings from a source domain to one or more target domains"
  method: post
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    body:
      - field: sourceDomainUUID
        type: string
        description: "UUID of the domain to copy settings from"
      - field: targetDomainUUIDs
        type: object
        description: "Array of target domain UUIDs to copy settings to"

extractRequestData:
  assign:
    sourceDomainUUID: ${incoming.body.sourceDomainUUID}
    targetDomainUUIDs: ${incoming.body.targetDomainUUIDs}

fetchSource:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-domain-bot-config"
    body:
      domainUUID: ${sourceDomainUUID}
  result: source
  next: transferToTargets

transferToTargets:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/set-domain-bot-config"
    body:
      is_bot_active: ${source.response.body[0].is_bot_active}
      is_burokratt_active: ${source.response.body[0].is_burokratt_active}
      is_csa_name_visible: ${source.response.body[0].is_csa_name_visible}
      is_csa_title_visible: ${source.response.body[0].is_csa_title_visible}
      is_edit_chat_visible: ${source.response.body[0].is_edit_chat_visible}
      instantly_open_chat_widget: ${source.response.body[0].instantly_open_chat_widget}
      show_sub_title: ${source.response.body[0].show_sub_title}
      sub_title: ${source.response.body[0].sub_title}
      response_waiting_time: ${source.response.body[0].response_waiting_time}
      response_processing_notice: ${source.response.body[0].response_processing_notice}
      created: ${new Date().toISOString()}
      domains: ${JSON.stringify(targetDomainUUIDs)}
  result: res

return_result:
  return: ${res.response.body}
  next: end
