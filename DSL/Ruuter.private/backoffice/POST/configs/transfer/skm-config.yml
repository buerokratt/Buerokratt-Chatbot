declaration:
  call: declare
  version: 0.1
  description: "Transfer SKM configuration settings from a source domain to one or more target domains"
  method: post
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    body:
      - field: sourceDomainUuid
        type: string
        description: "UUID of the domain to copy settings from"
      - field: targetDomainUuids
        type: object
        description: "Array of target domain UUIDs to copy settings to"

extractRequestData:
  assign:
    sourceDomainUuid: ${incoming.body.sourceDomainUuid}
    targetDomainUuids: ${incoming.body.targetDomainUuids}

fetchSource:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-domain-skm-config"
    body:
      domainUUID: ${sourceDomainUuid}
  result: source
  next: transferToTargets

transferToTargets:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/set-domain-skm-config"
    body:
      skm_range: ${source.response.body[0].range}
      skm_documents: ${source.response.body[0].documents}
      skm_system_message: ${source.response.body[0].systemMessage}
      skm_max_tokens: ${source.response.body[0].maxTokens}
      skm_index_name: ${source.response.body[0].indexName}
      skm_query_type: ${source.response.body[0].queryType}
      skm_semantic_configuration: ${source.response.body[0].semanticConfiguration}
      skm_in_scope: ${source.response.body[0].inScope}
      skm_use_agentic: ${source.response.body[0].useAgentic}
      azure_agent_name: ${source.response.body[0].azureAgentName}
      azure_agent_type: ${source.response.body[0].azureAgentType}
      azure_agentic_max_output_tokens: ${source.response.body[0].azureAgenticMaxOutputTokens}
      domains: ${JSON.stringify(targetDomainUuids)}
  result: res

return_result:
  return: ${res.response.body}
  next: end
