declaration:
  call: declare
  version: 0.1
  description: "Sets or clears the Vault-stored Azure agentic client secret for a single domain"
  method: post
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    body:
      - field: domain
        type: string
        description: "Body field 'domain'"
      - field: secret
        type: string
        description: "Body field 'secret'"

extractRequestData:
  assign:
    domain: ${incoming.body.domain}
    secret: ${incoming.body.secret ?? ''}
    vault_path: "${domain === 'none' ? 'global' : domain}"
    has_secret: "${secret !== '' ? 'true' : 'false'}"

writeSecret:
  call: http.post
  args:
    url: "[#VAULT_AGENT_BACKOFFICE]/v1/secret/data/backoffice/${vault_path}/azure-agentic"
    body:
      data:
        client_secret: ${secret}
  result: vault_result
  next: checkForDomain

checkForDomain:
  switch:
    - condition: ${domain === 'none'}
      next: setGlobalSecretStatus
  next: setDomainSecretStatus

setGlobalSecretStatus:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/set-skm-config-secret-status"
    body:
      azure_client_secret_is_set: ${has_secret}
  result: status_result
  next: return_result

setDomainSecretStatus:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/set-domain-skm-config-secret-status"
    body:
      domainUUID: ${domain}
      azure_client_secret_is_set: ${has_secret}
  result: status_result
  next: return_result

return_result:
  return: 'Azure agentic client secret updated successfully'
