declaration:
  call: declare
  version: 0.1
  description: "Sync chat to SMAX"
  method: post
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    header:
      - field: x-ruuter-nonce
        type: string
        description: "Nonce field"
    body:
      - field: chatBaseId
        type: string
        description: "Body field 'chatBaseId'"
      - field: displayLabel
        type: string
        description: "Body field 'displayLabel'"

extractRequestData:
  assign:
    chatBaseId: ${incoming.body.chatBaseId}
    displayLabel: "${incoming.body.displayLabel.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ')}"

# TODO: technical dept - ruuter is not able to parse plaintext response.
getAuthToken:
  call: http.post
  args:
    url: "[#CHATBOT_DMAPPER]/tmp/smax-auth"
    body:
      Login: "[#SMAX_LOGIN]"
      Password: "[#SMAX_PASSWORD]"
  result: smaxAuthRes

checkIfAuthorized:
  switch:
    - condition: "${smaxAuthRes.response.statusCodeValue === 200}"
      next: checkIfAlreadySynced
  next: return_unauthorized

checkIfAlreadySynced:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-smax-synchronization-by-chat-base-id"
    body:
      chatBaseId: ${chatBaseId}
  result: existingSync

checkIfDuplicate:
  switch:
    - condition: "${existingSync.response.body.length > 0}"
      next: return_already_synced
  next: getChatById

getChatById:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-smax-chat-by-base-id"
    body:
      chatBaseId: ${chatBaseId}
  result: chat

checkIfChatExists:
  switch:
    - condition: "${chat.response.body.length > 0}"
      next: getChatMessages
  next: return_chat_not_found

getChatMessages:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-chat-messages"
    body:
      chatId: ${chatBaseId}
  result: messages

formatMessagesForSmax:
  call: http.post
  args:
    url: "[#CHATBOT_DMAPPER]/smax-format-messages"
    body:
      messages: ${messages.response.body}
  result: formattedMessages

getChatCustomerSupportSmaxId:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/get-user-smax-id-by-chat-csi"
    body:
      chatCustomerSupportId: ${chat.response.body[0].customerSupportId}
  result: chatCustomerSupportSmaxId

setCustomerSupportSmaxAccountId:
  assign:
    csaSmaxAccountId: ${chatCustomerSupportSmaxId.response.body[0]?.smaxAccountId || ""}

setData:
  assign:
    smax_entities: [
      {
        "entity_type": "Request",
        "properties": {
          "DisplayLabel": '${displayLabel ?? chat.response.body[0].id}',
          "Description": "Link vestlusele: <a href='[#CHATBOT_GUI]/chat/history?chat=${chat.response.body[0].baseId}'>[#CHATBOT_GUI]/chat/history?chat=${chat.response.body[0].baseId}</a><br>Lõppkasutaja email: ${chat.response.body[0].endUserEmail}<br>Lõppkasutaja nimi: ${chat.response.body[0].endUserFirstName} ${chat.response.body[0].endUserLastName}<br><br>Vestluse sõnumid:<br>${formattedMessages.response.body.messagesHtml}",
          "RequestedByPerson": "[#SMAX_REQUESTED_BY_PERSON]",
          "ServiceDeskGroup": "[#SMAX_SERVICE_DESK_GROUP]",
          "OwnedByPerson": "${csaSmaxAccountId}",
          "RequestedForPerson": "${chat.response.body[0].endUserId}",
          "CreationSource": "CreationSourceExternal",
          "CreationSourceName_c": "Bürokratt",
          "RequestsOffering": "[#SMAX_REQUEST_OFFERING]"
        }
      }
    ]

createSmaxIssue:
  call: http.post
  args:
    url: "[#SMAX_CLOUD_DOMAIN]/rest/[#SMAX_TENANT_ID]/ems/bulk"
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
      Cookie: 'LWSSO_COOKIE_KEY=${smaxAuthRes.response.body.token}'
    body:
      entities: ${smax_entities}
      operation: "CREATE"
  result: res_smax

setResponseBody:
  assign:
    res_smax_body: ${res_smax.response.body}

createSynchronization:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/insert-chat-smax-synchronization"
    body:
      chatBaseId: ${chat.response.body[0]?.baseId ?? ""}
      status: "${res_smax_body.meta?.completion_status === 'OK' ? 'SUCCESS' : 'ERROR'}"
      smaxStatusCode: "${res_smax_body.meta?.completion_status === 'OK' ? 200 : res_smax_body.entity_result_list[0].errorDetails.httpStatus}"
      smaxErrorMessage: "${res_smax_body.meta?.completion_status === 'OK' ? '' : res_smax_body.entity_result_list[0].errorDetails.message}"
  result: create_res

return_result:
  return: "success"
  next: end

return_chat_not_found:
  status: 404
  return: "error: chat with ENDED status not found"
  next: end

return_already_synced:
  status: 409
  return: "error: chat already synced to SMAX"
  next: end

return_unauthorized:
  status: 401
  return: "error: unauthorized"
  next: end
