declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'DOWNLOAD'"
  method: post
  accepts: json
  returns: data
  namespace: analytics
  allowlist:
    body:
      - field: headers
        type: object
        description: "Body field 'headers'"
      - field: language
        type: string
        description: "Body field 'language'"
      - field: startDate
        type: string
        description: "Body field 'startDate'"
      - field: endDate
        type: string
        description: "Body field 'endDate'"
      - field: sorting
        type: string
        description: "Body field 'sorting'"
      - field: search
        type: string
        description: "Body field 'search'"
      - field: customerSupportIds
        type: object
        description: "Body field 'customerSupportIds'"
      - field: urls
        type: array
        description: "Body field 'urls'"
      - field: feedbackRatings
        type: array
        description: "Body field 'feedbackRatings'"
      - field: isTest
        type: array
        description: "Body field 'isTest'"
      - field: isPreserve
        type: array
        description: "Body field 'isPreserve'"
      - field: hasComment
        type: array
        description: "Body field 'hasComment'"
      - field: hasFeedback
        type: array
        description: "Body field 'hasFeedback'"
      - field: authenticatedChats
        type: array
        description: "Body field 'authenticatedChats'"
      - field: status
        type: array
        description: "Body field 'status'"
      - field: responseQuality
        type: array
        description: "Body field 'responseQuality'"
      - field: followUpStatus
        type: array
        description: "Body field 'followUpStatus'"
      - field: theme
        type: array
        description: "Body field 'theme'"
      - field: columnIds
        type: object
        description: "Body field 'columnIds'"

extractRequestData:
  assign:
    headers: ${incoming.body.headers}
    columnIds: ${incoming.body.columnIds}
    language: ${incoming.body.language}
    startDate: "${incoming.body.startDate}"
    endDate: "${incoming.body.endDate}"
    urls: ${incoming.body.urls}
    feedbackRatings: ${incoming.body.feedbackRatings ?? []}
    isTest: ${incoming.body.isTest ?? []}
    isPreserve: ${incoming.body.isPreserve ?? []}
    hasComment: ${incoming.body.hasComment ?? []}
    hasFeedback: ${incoming.body.hasFeedback ?? []}
    authenticatedChats: ${incoming.body.authenticatedChats ?? []}
    status: ${incoming.body.status ?? []}
    responseQuality: ${incoming.body.responseQuality ?? []}
    followUpStatus: ${incoming.body.followUpStatus ?? []}
    theme: ${incoming.body.theme ?? []}

fetchPage:
  call: http.post
  # Unpaginated export responses can exceed Ruuter's default 256 KiB buffer.
  # The limit is configured in constants.ini and specified in KiB.
  limit: "[#CHAT_HISTORY_EXPORT_RESPONSE_SIZE_LIMIT_KB]"
  args:
    url: "[#CHATBOT_RESQL]/get-cs-all-ended-chats"
    body:
      start: ${startDate}
      end: ${endDate}
      page: 1
      page_size: 100
      sorting: ${incoming.body.sorting}
      search: ${incoming.body.search}
      customerSupportIds: ${incoming.body.customerSupportIds?.join(',') ?? ''}
      csaId: ${"chatbot"}
      urls: ${urls}
      feedbackRatings: ${feedbackRatings}
      isTest: ${isTest}
      isPreserve: ${isPreserve}
      hasComment: ${hasComment}
      hasFeedback: ${hasFeedback}
      authenticatedChats: ${authenticatedChats}
      status: ${status}
      responseQuality: ${responseQuality}
      followUpStatus: ${followUpStatus}
      theme: ${theme}
      isChatAnalysisEnabled: ${true}
      isPaginationEnabled: ${false}
  result: pageResult
  next: checkHasResults

checkHasResults:
  switch:
    - condition: ${pageResult.response.body.length === 0}
      next: return_empty
  next: fetchPageMessages

fetchPageMessages:
  call: http.post
  # Message volume varies per chat and can exceed Ruuter's default 256 KiB buffer.
  # The limit is configured in constants.ini and specified in KiB.
  limit: "[#CHAT_HISTORY_EXPORT_RESPONSE_SIZE_LIMIT_KB]"
  args:
    url: "[#CHATBOT_RESQL]/get-chats-with-messages"
    body:
      chatIds: ${pageResult.response.body.map(c => c.id)}
  result: messagesResult
  next: get_xlsx_data

get_xlsx_data:
  call: http.post
  args:
    url: "[#CHATBOT_DMAPPER]/conversion/chats-to-xlsx"
    body:
      chatMessages: ${messagesResult.response.body}
      chatHeaders: ${headers}
      chatColumnIds: ${columnIds}
      chatIds: ${pageResult.response.body.map(c => c.id)}
      chatRows: ${pageResult.response.body}
      language: ${language}
  result: xlsxData
  next: assign_s3_filepath

assign_s3_filepath:
  assign:
    s3FilePath: ${'history/' + xlsxData.response.body.filePath.split('/').pop()}
  next: copy_xlsx_to_s3

copy_xlsx_to_s3:
  call: http.post
  args:
    url: "[#CHATBOT_S3_FERRY]/v1/files/copy"
    body:
      destinationStorageType: "S3"
      destinationConfigKey: "chats"
      destinationFilePath: ${s3FilePath}
      sourceStorageType: "FS"
      sourceConfigKey: "[#CHATBOT_S3_FERRY_SOURCE_CONFIG_KEY]"
      sourceFilePath: ${xlsxData.response.body.filePath}
  result: s3FileCopy
  error: unlink_xlsx_from_fs_after_export_error
  next: get_signed_url

get_signed_url:
  call: http.post
  args:
    url: "[#CHATBOT_S3_FERRY]/v1/files/signed-url/download"
    body:
      type: "S3"
      expiresInSec: 1800
      configKey: "chats"
      filePath: ${s3FilePath}
  result: signedUrlResponse
  error: unlink_xlsx_from_fs_after_export_error
  next: unlink_xlsx_from_fs_after_success

unlink_xlsx_from_fs_after_success:
  call: http.post
  args:
    url: "[#CHATBOT_DMAPPER]/conversion/chats-to-xlsx/unlink"
    body:
      filePath: ${xlsxData.response.body.filePath}
  result: unlinkResult
  error: return_unlink_error
  next: return_success

unlink_xlsx_from_fs_after_export_error:
  call: http.post
  args:
    url: "[#CHATBOT_DMAPPER]/conversion/chats-to-xlsx/unlink"
    body:
      filePath: ${xlsxData.response.body.filePath}
  result: unlinkResultAfterExportError
  error: return_unlink_error
  next: return_export_error

return_success:
  return: ${signedUrlResponse.response.body}
  next: end
  status: 200

return_export_error:
  return: "Failed to prepare chat history export download"
  next: end
  status: 500

return_unlink_error:
  return: "Failed to remove generated chat history export"
  next: end
  status: 500

return_empty:
  return: ''
  next: end
  status: 200
