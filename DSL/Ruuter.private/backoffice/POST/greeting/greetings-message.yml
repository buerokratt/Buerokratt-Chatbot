declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'IS-ACTIVE'"
  method: post
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    body:
      - field: isActive
        type: string
        description: "Body field 'isActive'"
      - field: est
        type: string
        description: "Body field 'est'"
      - field: type
        type: string
        description: "Body field 'type'"
      - field: serviceId
        type: string
        description: "Body field 'serviceId'"
      - field: serviceName
        type: string
        description: "Body field 'serviceName'"
      - field: domainUUID
        type: object
        description: "Body field 'domainUUID'"

extractRequestData:
  assign:
    isActive: ${incoming.body.isActive}
    message: ${incoming.body.est ?? ''}
    type: ${incoming.body.type ?? 'message'}
    serviceId: ${incoming.body.serviceId ?? ''}
    serviceName: ${incoming.body.serviceName ?? ''}
    domains: ${incoming.body.domainUUID}

validateConfig:
  switch:
    - condition: ${message.trim() === ''}
      next: returnInvalidBody
    - condition: ${type === 'service' && serviceId.trim() === ''}
      next: returnInvalidBody
  next: checkForDomains

checkForDomains:
  switch:
    - condition: ${domains.length > 0}
      next: setDomainGreetingsMessage
  next: setGreetingsMessage

setDomainGreetingsMessage:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/set-domain-greetings-message-config"
    body:
      isActive: ${isActive}
      message: ${message}
      type: ${type}
      serviceId: ${serviceId}
      serviceName: ${serviceName}
      created: ${new Date().toISOString()}
      domains: ${JSON.stringify(domains)}
  result: res
  next: return_result

setGreetingsMessage:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/set-greetings-message-config"
    body:
      isActive: ${isActive}
      message: ${message}
      type: ${type}
      serviceId: ${serviceId}
      serviceName: ${serviceName}
      created: ${new Date().toISOString()}
  result: res
  next: return_result

return_result:
  return: ${res.response.body}
  next: end

returnInvalidBody:
  status: 400
  return: "bad_request"
  next: end
