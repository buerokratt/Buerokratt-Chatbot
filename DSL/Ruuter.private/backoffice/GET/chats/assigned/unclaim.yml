declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'UNCLAIM'"
  method: get
  accepts: json
  returns: json
  namespace: backoffice
  allowlist:
    header:
      - field: cookie
        type: string
        description: "Cookie field"

get_user_info:
  call: http.post
  args:
   url: "[#CHATBOT_TIM]/jwt/custom-jwt-userinfo"
   contentType: plaintext
   headers:
    cookie: ${incoming.headers.cookie}
   plaintext: 
      "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: assignIdCode
  next: return_bad_request

assignIdCode:
  assign:
    idCode: ${res.response.body.idCode}
  next: unclaimAllAssignedChats

unclaimAllAssignedChats:
  call: http.post
  args:
    url: "[#CHATBOT_RESQL]/update-chats-assignee-by-user-id"
    body:
      userId: ${idCode}
  result: unclaim_res
  next: requeue_unclaimed_chats

requeue_unclaimed_chats:
  call: http.post
  args:
    url: "[#CHATBOT_NOTIFICATIONS]/enqueue-many"
    body:
      ids: ${unclaim_res.response.body.map(row => row.id)}
  result: queue_res
  next: check_queue_receipts

check_queue_receipts:
  switch:
    - condition: ${queue_res.response.statusCodeValue === 200}
      next: return_result
  next: return_queue_error

return_queue_error:
  status: 207
  return: ${queue_res.response.body}
  next: end

return_result:
  return: ${unclaim_res.response.body}
  next: end
