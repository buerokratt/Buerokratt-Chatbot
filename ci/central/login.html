<!doctype html><html lang="en"><meta charset="utf-8"><title>Fresh Central sign in</title><style>body{font:18px system-ui;max-width:28rem;margin:5rem auto}label,input,button{display:block;margin:.7rem 0}input{width:100%;padding:.6rem}button{padding:.6rem 1.2rem}#error{color:#a00}</style><h1>Fresh Central test</h1><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button><p id="error" role="alert"></p></form><script>document.querySelector('form').addEventListener('submit',async event=>{event.preventDefault();document.querySelector('#error').textContent='';try{const response=await fetch('/api/public/backoffice/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({login:document.querySelector('#username').value,password:document.querySelector('#password').value})});if(!response.ok)throw Error('Sign-in failed');window.location.assign('/chat/');}catch(error){document.querySelector('#error').textContent='Sign-in failed. Check your credentials.'}});</script></html>
